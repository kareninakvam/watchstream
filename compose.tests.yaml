name: watchstream-tests

services:
  mysql-test:
    image: mysql:8.4@sha256:a0225d1ea6631c8bc2385dc4c2faba17bbf1834ecf369e1659a9a382bd8d5dd7
    environment:
      MYSQL_DATABASE: watchstream_test
      MYSQL_USER: watchstream_test
      MYSQL_PASSWORD: testing-only
      MYSQL_ROOT_PASSWORD: testing-root-only
      TZ: UTC
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql -h 127.0.0.1 -u "$$MYSQL_USER" "$$MYSQL_DATABASE" -e "SELECT 1" >/dev/null 2>&1']
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 30s

  redis-test:
    image: redis:7.4@sha256:b6b6e3dc0c0952737748e55d5d885272840c7e42ba41ab1d5489f693419882f5
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  tests:
    image: watchstream-tests:local
    build: .
    init: true
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    environment:
      APP_ENV: testing
      APP_NAME: WatchstreamTests
      APP_DEBUG: "false"
      APP_CONFIG_CACHE: /tmp/watchstream-tests-config.php
      APP_KEY: base64:YWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWE=
      DB_CONNECTION: mysql
      DB_HOST: mysql-test
      DB_PORT: 3306
      DB_DATABASE: watchstream_test
      DB_USERNAME: watchstream_test
      DB_PASSWORD: testing-only
      DB_URL: ""
      REDIS_HOST: redis-test
      REDIS_PORT: 6379
      REDIS_PREFIX: watchstream_tests_
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      PULSE_ENABLED: "false"
    depends_on:
      mysql-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
    command: ["php", "vendor/bin/phpunit", "--configuration=phpunit.mysql.xml"]
